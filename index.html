<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Võ Lâm Hài Hiệp Truyện - AutoBattler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- Lớp Render Canvas cho lưới trận địa và hiệu ứng -->
        <canvas id="game-canvas"></canvas>
        
        <!-- Lớp UI DOM đè lên trên Canvas (Chứa HUD, Menu, Dialogue) -->
        <div id="ui-layer">
            <div id="loading-screen" class="screen active">
                <h1>Võ Lâm Hài Hiệp Truyện</h1>
                <p>Đang tụ khí đan điền...</p>
            </div>
            <!-- Các screen khác (MainMenu, Roster, Formation) sẽ được thêm ở Sprint sau -->
        </div>
    </div>

    <!-- Load file main dưới dạng ES6 Module -->
    <script type="module" src="./src/main.js"></script>
</body>
</html>
