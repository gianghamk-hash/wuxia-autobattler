name: Publish game to Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: game-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare runtime files
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest .nojekyll *.css _site/
          cp -R src assets _site/
          printf '{"commit":"%s","run":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > _site/deployment.json
          test -f _site/src/main.js
          test -f _site/src/config.js
          du -sh _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v5
